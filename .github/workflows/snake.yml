name: Generate Snake

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: JasmineChabbra
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%230D1117,%230E4429,%230063D1,%230A3069,%2326A641
            dist/github-contribution-grid-snake.svg?color_snake=%230284C7&color_dots=%23F6F8FA,%23D0D7DE,%236DABF7,%233A96F0,%231F6FEB

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

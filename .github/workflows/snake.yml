name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake (Blue Snake + Green Boxes)
        uses: Platane/snk@v3
        with:
          github_user_name: JasmineChabbra
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#0284c7&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
